<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account · PhilFIDA DV Tracking</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body class="auth-page" data-page="signup">
  <main class="auth-card" aria-labelledby="signupTitle">
    <div class="auth-brand">
      <span class="brand-mark" data-logo></span>
      <h1 id="signupTitle">PhilFIDA DV Tracking</h1>
      <p>Disbursement Voucher Tracking System · Create your account</p>
    </div>

    <div class="form-error" id="formError" role="alert"></div>

    <form id="signupForm" novalidate>
      <div class="form-grid">
        <div class="field">
          <label for="fullName">Full name</label>
          <input class="input" type="text" id="fullName" name="fullName" autocomplete="name"
                 placeholder="Juan D. Cruz" required maxlength="100" />
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input class="input" type="email" id="email" name="email" autocomplete="email"
                 placeholder="you@example.gov.ph" required maxlength="100" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" name="password" autocomplete="new-password"
                 placeholder="At least 6 characters" required minlength="6" maxlength="200" />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input class="input" type="password" id="confirmPassword" name="confirmPassword"
                 autocomplete="new-password" placeholder="Repeat your password" required maxlength="200" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Create Account</button>
      </div>
    </form>

    <p class="auth-alt">Already have an account? <a href="/login.html">Sign in</a></p>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/src/auth.js"></script>
</body>
</html>
